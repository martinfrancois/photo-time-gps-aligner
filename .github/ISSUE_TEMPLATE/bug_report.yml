name: Bug report
description: Report something that doesn't work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Leave out personal photos, real GPS tracks, Timeline exports, recovery files, private paths and other personal data, also from logs and screenshots.
  - type: textarea
    id: summary
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The commands you ran, ideally on the synthetic example from the README or other synthetic files.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Commit, operating system, Python and ExifTool versions, camera model, and anything else that matters here.
  - type: textarea
    id: logs
    attributes:
      label: Output or logs
      render: text
