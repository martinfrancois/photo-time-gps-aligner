name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl
      - run: exiftool -ver
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m compileall -q ./*.py examples
      - run: python -m unittest -v
      - name: Run the documented synthetic example
        shell: bash
        run: |
          python examples/make_photos.py output/photos
          python photo_time_gps.py plan output/photos \
            --reference DSC00010.ARW \
            --actual 2030-07-09T19:58:30-05:00 \
            --timezone America/Chicago \
            --gpx examples/track.gpx \
            --rename \
            --backup output/recovery | tee output/plan.txt
          grep -q 'Clock correction: -90.0 seconds; GPS matches: 2/3' output/plan.txt
          python photo_time_gps.py apply --backup output/recovery
          python photo_time_gps.py verify --backup output/recovery
